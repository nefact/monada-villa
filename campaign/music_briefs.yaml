# Music direction per Reel, for picking a track from Instagram's licensed library / Meta Sound Collection at upload.
# These are moods and search words, not specific tracks. No track is claimed to be trending.
# At upload: Add audio → choose a track → Edit → set "Original audio" to 0 (it only holds the placeholder ambient pad).
defaults:
  bpm: "70–95"
  avoid: "lyrics in the first 3 s, EDM drops, epic trailer music, viral meme sounds"
briefs:
  R01: {mood: "open, airy, first impression", genre: "ambient electronic / soft house", search: ["chill house", "ambient", "summer calm"], bpm: "95–110"}
  R02: {mood: "slow morning, tender", genre: "solo piano / lo-fi", search: ["morning piano", "lofi morning", "soft piano"]}
  R03: {mood: "organic, green, breathing", genre: "acoustic guitar / nature ambient", search: ["acoustic calm", "nature ambient", "fingerstyle"]}
  R04: {mood: "watery, day-to-night", genre: "downtempo / chillwave", search: ["downtempo", "chillwave", "pool vibes"]}
