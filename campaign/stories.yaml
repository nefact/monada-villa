# Daily Stories, 2–3 frames per day (6 s each, 1080x1920) from archive media.
# `sticker` is added by hand in the Instagram app (poll, quiz, question, slider, countdown, link). The renderer
# keeps the upper-middle area clear for it. `from` reuses a shot from that day's Reel (frame 1 = its hook shot).
# No sale wording before day 30 (checked by `python -m monada lint`).
stories:
- {day: 1,  frames: [{from: R01, text: "New: a first look at Monada"}, {subject: [garden], text: "Follow the diary"}, {subject: [pool], sticker: "emoji slider 🌿"}]}
