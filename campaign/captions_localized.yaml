# Localized captions for priority items. zh = Xiaohongshu note (title ≤ 20 chars + body + topics), ko = Instagram caption.
# Native-speaker review required. No sale/price/investment words before day 30.
R01:
  zh:
    title: "巴厘岛的一座私宅，慢下来"
    body: |
      不只是一座别墅，是另一种生活节奏。
      热带花园、泳池和安静的建筑，在巴厘岛 Pererenan。
      欢迎来到 Monada，接下来 30 天，记录这里的日常。
    topics: ["#巴厘岛", "#巴厘岛别墅", "#建筑美学", "#慢生活"]
  ko: |
    단순한 빌라가 아니라, 다른 삶의 리듬.
    발리 페레레난의 열대 정원과 조용한 건축.
    Monada에 오신 걸 환영해요. 발리 리빙 다이어리를 팔로우하세요.
R03:
  zh:
    title: "花园才是这座房子的主角"
    body: |
      花园不是剩下的空间。在 Monada，它是最重要的房间。
    topics: ["#巴厘岛", "#庭院设计", "#热带花园"]
  ko: |
    정원은 남는 공간이 아니에요. Monada에서는 가장 중요한 방입니다.
R10:
  zh:
    title: "为什么不多建几间卧室？"
    body: |
      两间卧室，以及足够呼吸的空间。
      我们选择了花园、光线和私密，而不是更多的墙。
      空间，是新的奢侈。
    topics: ["#建筑美学", "#空间设计", "#巴厘岛别墅"]
  ko: |
    두 개의 침실, 그리고 숨 쉴 공간.
    더 많은 벽 대신 정원과 빛, 프라이버시를 택했어요.
    공간이 새로운 럭셔리입니다.
R14:
  zh:
    title: "好的设计不需要喧哗"
    body: |
      肌理、比例与自然光——让一座房子安静下来的，是这些细节。
    topics: ["#室内设计", "#极简", "#建筑细节"]
  ko: |
    질감, 비율, 그리고 자연광. 집을 고요하게 만드는 건 이런 디테일이에요.
R16:
  zh:
    title: "为休息而设计的卧室"
    body: |
      两间卧室，各有各的安静。
    topics: ["#卧室设计", "#巴厘岛", "#慢生活"]
  ko: |
    두 개의 침실, 각자의 고요함.
R18:
  zh:
    title: "我们相信，家应该让人有所感受"
    body: |
      Monada 是我们在巴厘岛生活的方式。
      这些画面来自我们自己的相册。
    topics: ["#家的故事", "#巴厘岛生活"]
  ko: |
    Monada는 우리가 발리에서 사는 방식이 되었어요.
    이 장면들은 우리의 기록에서 가져왔습니다.
R21:
  zh:
    title: "来自我们的相册"
    body: |
      翻看我们自己拍下的 Monada 照片和视频。
      （2023–2024 年的存档影像。）
    topics: ["#巴厘岛", "#家的故事", "#慢生活"]
  ko: |
    우리가 직접 찍은 Monada의 사진과 영상을 다시 꺼내 봤어요.
    (2023–2024년 기록 영상)
R24:
  zh:
    title: "明天，新的篇章开始"
    body: |
      明天，新的篇章开始。
    topics: ["#巴厘岛", "#Monada"]
  ko: |
    내일, 새로운 챕터가 시작됩니다.
R25:
  zh:
    title: "Monada Villa 正式出售"
    body: |
      每个家都有故事。我们的家，准备迎来新的篇章。
      过去一个月，我们分享了 Monada 的光线、热带花园和安静的空间。
      今天，Monada Villa 正式出售，位于巴厘岛 Pererenan。
      视频素材来自我们 2023–2024 年的相册，房屋现状请私信咨询。
      私人看房需预约，欢迎添加微信获取房产资料。
    topics: ["#巴厘岛房产", "#巴厘岛别墅", "#Pererenan"]
  ko: |
    모든 집에는 이야기가 있어요. 우리의 집이 새로운 챕터를 맞을 준비가 되었습니다.
    지난 한 달 동안 Monada의 빛, 열대 정원, 고요한 공간을 나눴어요.
    오늘, 발리 페레레난의 Monada Villa 매각을 알려드립니다.
    캠페인 영상은 2023–2024년 기록이며, 현재 상태는 DM으로 문의해 주세요.
    프라이빗 뷰잉은 예약제입니다. DM으로 MONADA를 보내주세요.
