# 24 archive Reels + 1 sale reveal (R25).
# Slots are *requirements*, not shot lists: the composer fills them from library/shot_index.csv
# using only real Monada media. If a required slot can't be filled, the `fallback` story is used;
# if that fails too, the reel is reported as a gap — nothing is invented.
#
# Tag vocabulary (library/tags.csv):
#   subject:   pool garden living kitchen dining bedroom bathroom office terrace firepit
#              exterior entrance aerial detail neighbourhood beach
#   lighting:  morning day golden evening night overcast rain
#   shot_type: wide medium detail aerial move
# {{fact}} placeholders resolve from campaign/facts.yaml.
# Captions never use "now / today / currently" about the footage: the archive is 2023–2024.

reels:

# ───────────── DAYS 1–10 · ATMOSPHERE & ASPIRATION ─────────────
- id: R01
  day: 1
  title: First look
  markets: [AU, SG, UK, IN, KR, CN]
  audio: natural
  hook: "This is what {{land_area}} of Bali feels like."
  alt_hook: "Not every Bali home needs more walls."
  slots:
    - {role: hook, pin: 3499b65f95ae, alt_pin: 600509f91c46, subject: [pool], dur: 3.0}
    - {subject: [living, terrace], dur: 3.5, prefer: video}
    - {subject: [pool], dur: 2.5}
    - {subject: [detail], dur: 2.0}
    - {subject: [garden], dur: 2.5}
    - {subject: [exterior, aerial, garden], shot_type: [wide, aerial], dur: 3.5}
    - {role: endcard, subject: [pool, garden, exterior], dur: 3.0, text: "MONADA\nA slower way to live."}
  caption: |
    Not just a villa. A different rhythm of life.
    Space, tropical greenery and quiet architecture in {{location}}.
    Welcome to Monada — follow our Bali living diaries.
  hashtags: ["#SlowLiving", "#TropicalModernism"]
  facts: [land_area, location]

