  caption: |
    Every home has a story. Ours is ready for a new chapter.

    Over the past month we've shared the little things that make Monada special — the morning light, the tropical garden, the quiet spaces.

    Today we're sharing something new: Monada Villa is for sale.

    In {{location}}: {{land_area}} of land, {{bedrooms}}, {{home_office}}, a private pool and generous indoor-outdoor living.
    Footage in this campaign comes from our 2023–2024 home archive — ask us about the property's present condition.

    For property details, tenure, asking price and private viewings, send us a DM with MONADA.
