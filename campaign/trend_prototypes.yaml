# Trend-format prototypes (v2 edit style). Hand-picked shots from the archive, cut on a beat grid.
# beats at `bpm` → seconds. motion: push (zoom in) | pull (zoom out reveal) | none. speed: >1 speeds a video clip up.
# `at` = where in the clip to start (0 = beginning, 0.5 = middle, 1 = end).
# Formats are adapted from Nov 2026 trend roundups (NewEngen, NapoleonCat) — see strategy/trends-nov-2026.md.
bpm: 120
prototypes:

- id: P1
  name: camera_roll
  format: "Camera-roll dump: 12 sub-second clips, end on the best shot (NewEngen 'Lately on my SD card', adapted: archive, so no 'lately')"
  hook: "From my Bali camera roll"
  sub: "MONADA · Pererenan"
  clips:
    - {shot: 1d986ae6ff33, beats: 1.5, at: 0.3}
    - {shot: f9c527d7b0fa, beats: 1.5, at: 0.4}
    - {shot: 198449c928ba, beats: 1.5, at: 0.4}
    - {shot: 9d714c9cf14d, beats: 1.5, at: 0.4}
    - {shot: fe18c5386e6f, beats: 1.5, motion: push}
    - {shot: 89c9263af625_s02, beats: 1.5, at: 0.5}
    - {shot: 4df7b687d266, beats: 1.5, at: 0.4}
    - {shot: fcca8b70c29d, beats: 1.5, motion: pull}
    - {shot: ff401a0881d7, beats: 1.5, at: 0.2}
    - {shot: c2287d81cbf8, beats: 1.5, motion: push}
    - {shot: 70151057cef0, beats: 1.5, at: 0.4}
    - {shot: 8d2fe7cc1b95, beats: 1.5, motion: push}
    - {shot: 3499b65f95ae, beats: 4, motion: pull, label: "MONADA", label_style: brand}

